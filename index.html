<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAMID Interview Recorder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
  :root{
    --bg:#F2F5FA;
    --surface:#FFFFFF;
    --surface-2:#EAF0F8;
    --text:#182430;
    --text-muted:#5C6B7E;
    --border:#DBE3EE;
    --accent:#1E4D8C;
    --accent-strong:#123761;
    --accent-soft:#E7EFFA;
    --success:#1B8A5A;
    --success-soft:#E3F5EA;
    --warning:#A96A0A;
    --warning-soft:#FBEEDA;
    --live:#C23B3B;
    --live-soft:#FBE7E7;
    --shadow:0 1px 2px rgba(20,36,60,.06), 0 10px 28px -14px rgba(20,36,60,.22);
    --radius:12px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1520;
      --surface:#161F2B;
      --surface-2:#1D2836;
      --text:#E7ECF3;
      --text-muted:#94A4B6;
      --border:#2A3644;
      --accent:#6EA0E0;
      --accent-strong:#9BC0EE;
      --accent-soft:#1C2C40;
      --success:#4CBE8B;
      --success-soft:#12261E;
      --warning:#E0A63C;
      --warning-soft:#2E2412;
      --live:#E5716B;
      --live-soft:#301A1A;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1520;
    --surface:#161F2B;
    --surface-2:#1D2836;
    --text:#E7ECF3;
    --text-muted:#94A4B6;
    --border:#2A3644;
    --accent:#6EA0E0;
    --accent-strong:#9BC0EE;
    --accent-soft:#1C2C40;
    --success:#4CBE8B;
    --success-soft:#12261E;
    --warning:#E0A63C;
    --warning-soft:#2E2412;
    --live:#E5716B;
    --live-soft:#301A1A;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Source Sans 3', system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Sora', system-ui, sans-serif; text-wrap:balance; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  img{ max-width:100%; }
  [hidden]{ display:none!important; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  table{ border-collapse:collapse; width:100%; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  /* ---------- Lock screen ---------- */
  .lock-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(circle at 15% 10%, var(--accent-soft), transparent 45%),
      var(--bg);
  }
  .lock-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:32px 28px;
  }
  .lock-brand{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .lock-mark{
    width:44px; height:44px; border-radius:11px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif; font-weight:700; font-size:19px;
    flex-shrink:0;
  }
  .lock-brand h1{ font-size:18px; margin-bottom:2px; }
  .lock-brand p{ font-size:13px; color:var(--text-muted); }
  #lock-form{ display:flex; flex-direction:column; gap:10px; }
  #lock-form label{ font-size:13px; font-weight:600; color:var(--text-muted); }
  #lock-input{
    padding:11px 13px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); letter-spacing:.04em;
  }
  #lock-form button{
    margin-top:6px; padding:11px 13px; border-radius:9px; border:none;
    background:var(--accent); color:#fff; font-weight:600; cursor:pointer;
    transition:background .15s ease;
  }
  #lock-form button:hover{ background:var(--accent-strong); }
  .lock-error{ color:var(--live); font-size:13px; margin-top:2px; }

  /* ---------- App shell ---------- */
  #app-shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:228px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:4px; padding:20px 14px;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 20px; }
  .brand-mark{
    width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif;
    font-weight:700; font-size:14px; flex-shrink:0;
  }
  .brand-name{ font-family:'Sora',sans-serif; font-weight:700; font-size:14.5px; }
  .nav-btn{
    text-align:left; padding:10px 12px; border-radius:9px; border:none;
    background:transparent; color:var(--text-muted); font-weight:600; font-size:14px;
    cursor:pointer; transition:background .12s ease, color .12s ease;
  }
  .nav-btn:hover{ background:var(--surface-2); color:var(--text); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .sidebar-spacer{ flex:1; }
  .nav-btn-ghost{ color:var(--text-muted); font-weight:500; font-size:13px; }
  .main-col{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    height:60px; flex-shrink:0; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; background:var(--surface);
  }
  #topbar-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; }
  .sync-indicator{ font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
  #view-root{ flex:1; padding:28px 30px 60px; overflow:auto; }

  @media (max-width: 780px){
    #app-shell{ flex-direction:column; }
    .sidebar{
      width:100%; flex-direction:row; align-items:center; overflow-x:auto;
      border-right:none; border-bottom:1px solid var(--border); padding:10px 12px;
    }
    .brand{ padding:4px 10px 4px 2px; }
    .sidebar-spacer{ display:none; }
    .nav-btn{ white-space:nowrap; }
    #view-root{ padding:20px 16px 48px; }
  }

  /* ---------- Shared UI atoms ---------- */
  .view-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .view-head h2{ font-size:22px; margin-bottom:4px; }
  .view-head .sub{ color:var(--text-muted); font-size:13.5px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    font-weight:600; font-size:13.5px; cursor:pointer; transition:border-color .12s ease, background .12s ease;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-danger{ color:var(--live); border-color:var(--border); }
  .btn-danger:hover{ border-color:var(--live); }
  .btn-live{ background:var(--live); border-color:var(--live); color:#fff; }
  .btn-live:hover{ background:#a52f2f; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .stat-card .num{ font-family:'Sora',sans-serif; font-size:26px; font-weight:700; }
  .stat-card .label{ color:var(--text-muted); font-size:12.5px; margin-top:2px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:20px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
  .card-head h3{ font-size:15.5px; }

  .table-wrap{ overflow-x:auto; }
  th,td{ text-align:left; padding:11px 14px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:top; }
  th{ color:var(--text-muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  td input, td textarea{ width:100%; padding:6px 8px; border:1px solid transparent; border-radius:6px; background:transparent; }
  td textarea.q-edit{ resize:none; overflow:hidden; min-height:38px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  td input:hover, td textarea:hover, td input:focus, td textarea:focus{ border-color:var(--border); background:var(--bg); }
  .empty-row td{ color:var(--text-muted); font-style:italic; text-align:center; padding:26px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill-success{ background:var(--success-soft); color:var(--success); }
  .pill-muted{ background:var(--surface-2); color:var(--text-muted); }
  .pill-warning{ background:var(--warning-soft); color:var(--warning); }

  .toast-root{ position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:999; max-width:340px; }
  .toast{
    background:var(--text); color:var(--bg); padding:11px 15px; border-radius:9px; font-size:13.5px;
    box-shadow:var(--shadow); animation:toast-in .18s ease;
  }
  .toast-error{ background:var(--live); color:#fff; }
  .toast-success{ background:var(--success); color:#fff; }
  .toast-warn{ background:var(--warning); color:#12100a; }
  @keyframes toast-in{ from{ transform:translateY(6px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

  /* ---------- New interview: setup ---------- */
  .setup-grid{ display:grid; grid-template-columns:1.1fr .9fr; gap:20px; align-items:start; }
  @media (max-width: 900px){ .setup-grid{ grid-template-columns:1fr; } }
  .field-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field-group label{ font-size:12.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
  .field-group input, .field-group select, .field-group textarea{
    padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);
  }
  .radio-row{ display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .radio-row label{ display:flex; align-items:center; gap:6px; font-size:13.5px; cursor:pointer; }
  .q-preview-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .q-preview-list li{ font-size:13.5px; padding:9px 12px; background:var(--surface-2); border-radius:8px; display:flex; gap:10px; }
  .q-preview-list .qnum{ color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12px; flex-shrink:0; }

  /* ---------- Recording screen ---------- */
  .rec-layout{ display:grid; grid-template-columns:260px 1fr; gap:20px; align-items:start; }
  @media (max-width: 900px){ .rec-layout{ grid-template-columns:1fr; } }
  .rec-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
  .rec-status{ display:flex; align-items:center; gap:10px; }
  .rec-dot{ width:11px; height:11px; border-radius:50%; background:var(--live); animation:pulse 1s ease-in-out infinite; }
  .rec-timer{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:500; }
  .q-rail{ display:flex; flex-direction:column; gap:8px; }
  .q-rail-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:9px; background:var(--surface); border:1px solid var(--border); font-size:13px; cursor:pointer; transition:border-color .15s; }
  .q-rail-item:hover{ border-color:var(--accent); }
  .q-rail-item.current{ border-color:var(--live); background:var(--live-soft); }
  .q-rail-item.done{ border-color:var(--success); background:var(--success-soft); }
  .q-dot{
    width:16px; height:16px; border-radius:50%; background:var(--border); margin-top:1px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff;
  }
  .q-rail-item.done .q-dot{ background:var(--success); }
  .q-rail-item.current .q-dot{ background:var(--live); animation:pulse 1s ease-in-out infinite; }
  #mic-status.mic-active{ color:var(--success); font-weight:600; }
  #mic-status.mic-error{ color:var(--live); font-weight:600; }
  .transcript-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; min-height:360px; max-height:520px; overflow-y:auto; }
  .transcript-line{ margin-bottom:12px; font-size:14px; line-height:1.55; }
  .transcript-tag{ display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin-right:8px; background:var(--accent-soft); padding:2px 7px; border-radius:5px; }
  .transcript-interim{ color:var(--text-muted); font-style:italic; }
  .rec-footer{ margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .hint{ color:var(--text-muted); font-size:13px; }
  .fallback-box textarea{ width:100%; min-height:220px; padding:14px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); resize:vertical; }
  .warn-banner{ background:var(--warning-soft); color:var(--warning); border-radius:9px; padding:12px 14px; font-size:13.5px; margin-bottom:18px; }

  /* ---------- Review screen ---------- */
  .qa-card{ border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; background:var(--surface); }
  .qa-card .q-text{ font-weight:600; margin-bottom:8px; font-size:14.5px; }
  .qa-card textarea{ width:100%; min-height:90px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); resize:vertical; font-size:13.5px; }
  .qa-card .summary-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:10px 0 4px; font-weight:600; }
  .qa-card textarea.summary{ min-height:44px; font-size:13px; line-height:1.5; resize:none; overflow:hidden; }
  #rv-overall{ resize:none; overflow:hidden; line-height:1.5; }
  .rubric-list{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; }
  .rubric-row{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; transition:border-color .15s; }
  .rubric-row.done{ border-color:color-mix(in srgb, var(--success) 45%, var(--border)); }
  .rubric-row.missing{ border-color:var(--live); box-shadow:0 0 0 3px color-mix(in srgb, var(--live) 18%, transparent); }
  .rubric-head{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; margin-bottom:12px; }
  .rubric-name{ font-weight:700; font-size:15px; }
  .rubric-criteria{ color:var(--text-muted); font-size:13px; margin-top:2px; line-height:1.45; }
  .rubric-score-now{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; min-width:56px; text-align:right; }
  .rubric-score-now span{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .score-row{ display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:6px; }
  .score-btn{ height:38px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums; transition:background .12s, border-color .12s; }
  .score-btn:hover{ border-color:var(--accent); }
  .score-btn.on.band-low{ background:var(--live); border-color:var(--live); color:#fff; }
  .score-btn.on.band-mid{ background:var(--warning); border-color:var(--warning); color:#fff; }
  .score-btn.on.band-high{ background:var(--success); border-color:var(--success); color:#fff; }
  .anchor-row{ display:grid; grid-template-columns:3fr 4fr 3fr; gap:8px; margin-top:8px; font-size:11.5px; color:var(--text-muted); line-height:1.4; }
  .anchor-row b{ color:var(--text); font-weight:700; margin-right:2px; }
  .anchor-row span:nth-child(2){ text-align:center; } .anchor-row span:nth-child(3){ text-align:right; }
  @media (max-width: 640px){ .anchor-row{ grid-template-columns:1fr; } .anchor-row span{ text-align:left !important; } .score-row{ gap:4px; } .score-btn{ height:34px; font-size:13px; } }
  .rubric-notes{ width:100%; margin-top:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); resize:none; overflow:hidden; font-size:13px; min-height:36px; }
  .rubric-extra{ margin-bottom:18px; }
  .rubric-extra textarea{ resize:none; overflow:hidden; }
  .yn-row{ display:flex; gap:8px; flex-wrap:wrap; padding:2px; border-radius:10px; }
  .yn-row.missing{ box-shadow:0 0 0 2px var(--live); }
  .yn-btn{ padding:9px 18px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-weight:600; cursor:pointer; }
  .yn-btn.on.yes{ background:var(--success); border-color:var(--success); color:#fff; }
  .yn-btn.on.no{ background:var(--live); border-color:var(--live); color:#fff; }
  .rubric-footer{ position:sticky; bottom:0; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .rubric-total{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .rubric-total span{ font-size:14px; color:var(--text-muted); font-weight:600; }
  .flag-pill{ background:color-mix(in srgb, var(--live) 14%, transparent); color:var(--live); }
  .ai-status{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 16px; margin-bottom:18px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); font-size:13px; color:var(--text-muted); }
  .ai-status strong{ color:var(--text); }
  .not-asked-flag{ color:var(--warning); font-size:12px; font-weight:600; margin-left:8px; }

  .doc-preview{ font-family:'Source Sans 3',sans-serif; }
  .doc-preview h4{ font-size:14px; margin-bottom:4px; }
</style>
</head>

  function buildQuestionModel(questions){

  // Coverage accounting that understands "choose one of a group"

  // required unit, satisfied as soon as ANY member of the group was asked).
  // Works on any array of {group, asked} objects (qa entries).
  function groupCoverage(qaList){
    var requiredTotal = 0, requiredSatisfied = 0;
    var seenGroups = {};
    qaList.forEach(function(q){
      if (q.group){
        if (seenGroups[q.group]) return;
        seenGroups[q.group] = true;
        requiredTotal++;

        if (anyAsked) requiredSatisfied++;

        requiredTotal++;
        if (q.asked) requiredSatisfied++;
      }
    });
    return { requiredTotal: requiredTotal, requiredSatisfied: requiredSatisfied, fullyCovered: requiredTotal > 0 && requiredSatisfied === requiredTotal };

  function chunkAnswer(text){

  function tidy(c){ c = c.trim().replace(/\s+/g, ' '); return c.charAt(0).toUpperCase() + c.slice(1); }
  function keyLines(text, n){
    var chunks = (Array.isArray(text) ? text : chunkAnswer(text)).filter(function(c){ return !looksLikeInterviewerLine(c); });
    var ranked = chunks.slice().sort(function(a,b){ return chunkScore(b) - chunkScore(a); }).slice(0, n || 3);
    return chunks.filter(function(c){ return ranked.indexOf(c) !== -1; }).map(tidy);
  }
  function formatSummary(bullets){
    return (bullets || []).filter(Boolean).map(function(b){ return '• ' + b.replace(/^[•\-*\s]+/, ''); }).join('\n');
  }
  function summarize(text, maxSentences){
    if (!String(text || '').trim()) return '';
    return formatSummary(keyLines(text, maxSentences || 3));
  }

  // Multi-part questions ("Why join TAMID? Why should TAMID want you?")
  // get a separate, labeled summary section per part.
  function questionParts(text){
    var parts = (String(text || '').match(/[^?]+\?+|[^?]+$/g) || []).map(function(x){ return x.trim(); })
      .filter(function(x){ return conceptTokens(x).length >= 1 && x.split(/\s+/).length >= 3; });
    return parts.length >= 2 ? parts : [String(text || '').trim()];
  }
  function formatSections(sections){
    if (sections.length === 1 && !sections[0].title) return formatSummary(sections[0].bullets);
    return sections.map(function(sec, i){
      var bullets = sec.bullets && sec.bullets.length ? sec.bullets : ['Didn’t clearly answer this part'];
      var body = bullets.map(function(b){ return '• ' + String(b).replace(/^[•\-*\s]+/, ''); }).join('\n');
      return 'PART ' + (i + 1) + ' — ' + sec.title + '\n' + body;
    }).join('\n\n');
  }
  // No-AI fallback: guess where the candidate stops answering part 1 and
  // starts part 2. If the interviewer re-reads a later part mid-answer,
  // that line is used as the dividing point; otherwise it picks the split
  // where earlier chunks look most like part 1 and later ones like part 2.
  // Parts like "Why should TAMID be interested in YOU?" / "What would you
  // bring?" are about the candidate's value; answers to them sound like
  // "I bring…", "my skills…". Parts about motivation sound like "I want…",
  // "I'm excited…". Examples sound like "for example…", "one time…".
  var PART_KINDS = [
    { q: /\b(should .*\b(want|interested in|pick|choose|accept|take) you|what (can|would|will) you (bring|offer|add|contribute)|why (should we|you)|what makes you (a good|stand)|good fit)\b/i,
      a: /\b(i bring|i can bring|i'?d bring|i would bring|i offer|i can offer|my skills?|skill set|skills|strengths?|i'?m good at|i'?m really good|experience (in|with)|contribute|add value|asset|hard ?working|work ethic|reliable|dedicated|as for why|why you should|you should (want|pick|choose)|i would be a|i'?d be a|i'?m a (strong|great|good))\b/i },
    { q: /\b(example|a time|describe a time|tell us about a time|instance)\b/i,
      a: /\b(for example|for instance|one time|there was a time|last (semester|year|summer|spring|fall)|in (high school|my class)|recently|when i was)\b/i },
    { q: /\b(why .*(interested|want|join|apply)|what (drew|draws|attracted|interests))\b/i,
      a: /\b(i want|i'?m interested|interested in|i love|excited|drawn|passion|the reason|because i|i'?ve always wanted|i heard|my friend told)\b/i }
  ];
  var PART_BOUNDARY = /^(and )?(as for|as to|for the second|the second part|second part|for the other|the other part|second question|and why|now why|why you should|as far as why)\b/i;
  function splitAnswerByParts(parts, answer){
    var chunks = chunkAnswer(answer);
    if (!chunks.length) return parts.map(function(){ return []; });
    var models = buildQuestionModel(parts.map(function(t, i){ return { id: 'p' + i, text: t }; }));
    var kinds = parts.map(function(t){ for (var i = 0; i < PART_KINDS.length; i++) if (PART_KINDS[i].q.test(t)) return PART_KINDS[i]; return null; });
    var sc = chunks.map(function(c){
      var toks = conceptTokens(c);
      return models.map(function(m, pi){ return scoreUtterance(toks, m) + (kinds[pi] && kinds[pi].a.test(c) ? 1 : 0); });
    });
    var bounds = [0];
    var k = parts.length;
    for (var pi = 1; pi < k; pi++){
      var start = bounds[pi - 1], bestAt = -1, bestVal = -Infinity;
      for (var at = start + 1; at <= chunks.length - (k - pi - 1); at++){
        var v = 0;
        for (var ci = start; ci < chunks.length; ci++) v += (ci < at ? 1 : -1) * (sc[ci][pi - 1] - sc[ci][pi]);
        // an interviewer re-reading this part is a near-certain divider
        if (looksLikeInterviewerLine(chunks[at] || '') && (sc[at] || [])[pi] >= 0.5) v += 5;
        if (PART_BOUNDARY.test(chunks[at] || '')) v += 3;                // "as for why you should want me…" 
        if (v > bestVal){ bestVal = v; bestAt = at; }
      }
      if (bestVal <= 0 && pi === 1 && chunks.length > 1 && sc.every(function(r){ return r.every(function(x){ return x === 0; }); })) bestAt = Math.ceil(chunks.length / 2);
      bounds.push(Math.max(start, bestAt));
    }
    bounds.push(chunks.length);
    return parts.map(function(_, i){ return chunks.slice(bounds[i], bounds[i + 1]); });
  }
  function summarizeFor(questionText, answer){
    if (!String(answer || '').trim()) return '';
    var parts = questionParts(questionText);
    if (parts.length === 1) return summarize(answer, 3);
    var pieces = splitAnswerByParts(parts, answer);
    return formatSections(parts.map(function(title, i){
      var t = (pieces[i] || []).map(function(c){ return c.replace(/^(and )?(as for|as to|as far as) (why |the second[^,]*? )?(you should (want|pick|choose) me|tamid should (want|pick) me)?\s*/i, ''); }).filter(function(c){ return c.split(/\s+/).length >= 4; });
      return { title: title, bullets: t.length ? keyLines(t, 2) : [] };
    }));
  }

  function buildOverallSummary(candidateName, qa, opening){
    var answered = qa.filter(function(x){ return x.asked && x.answerText.trim(); });
    var lines = [candidateName + ' — ' + answered.length + ' of ' + qa.length + ' bank questions covered.'];
    var bullets = [];
    answered.forEach(function(x){ var k = keyLines(x.answerText, 1)[0]; if (k) bullets.push(k); });
    if (!answered.length && opening) bullets = keyLines(opening, 3);
    return lines.join('') + '\n\n' + formatSummary(bullets.slice(0, 6));
  }



  /* ============================================================
     AI summaries — Chrome's built-in AI (Gemini Nano, the Prompt API).
     Runs entirely on this computer: free, no API key, and the interview
     never leaves the laptop. Needs a recent desktop Chrome on a machine
     Chrome supports for built-in AI (roughly 16 GB RAM or a 4 GB+ GPU,
     ~22 GB free disk for the one-time model download). Anywhere else the
     review screen falls back to the no-AI key lines above.
     ============================================================ */
  var AI_LANG = { expectedInputs: [{ type: 'text', languages: ['en'] }], expectedOutputs: [{ type: 'text', languages: ['en'] }] };
  var AI_SYSTEM = 'You help a college business club’s exec board review membership interviews. ' +
    'You are given one interview question and a speech-to-text transcript of the candidate’s answer. ' +
    'The transcript has no punctuation, may contain mis-heard words, and may include the interviewer’s own follow-up questions or filler ("okay", "great") — ignore those. ' +
    'Write 2 to 4 short bullet points (each under 20 words) capturing what the candidate actually said: specific experiences, examples, reasons, skills. ' +
    'Write bullets in third person ("Leads group projects as the organizer"), no filler, and never invent details that are not in the transcript. ' +
    'If the answer is empty or unrelated, return an empty list.';
  var AI_Q_SCHEMA = { type: 'object', properties: {
    bullets: { type: 'array', items: { type: 'string' }, maxItems: 4 }
  }, required: ['bullets'] };
  var AI_OVERALL_SCHEMA = { type: 'object', properties: {
    overview: { type: 'string' },
    strengths: { type: 'array', items: { type: 'string' }, maxItems: 4 },
    concerns: { type: 'array', items: { type: 'string' }, maxItems: 3 }
  }, required: ['overview', 'strengths', 'concerns'] };

  function aiApi(){ return (typeof LanguageModel !== 'undefined') ? LanguageModel : null; }
  function aiAvailability(){
    var LM = aiApi();
    if (!LM || !LM.availability) return Promise.resolve('unsupported');
    return LM.availability(AI_LANG).catch(function(){ return LM.availability(); }).catch(function(){ return 'unavailable'; });
  }
  var aiBaseSession = null;
  function aiGetSession(onProgress){
    if (aiBaseSession) return Promise.resolve(aiBaseSession);
    var opts = Object.assign({}, AI_LANG, {
      initialPrompts: [{ role: 'system', content: AI_SYSTEM }],
      monitor: function(m){ m.addEventListener('downloadprogress', function(e){ if (onProgress) onProgress(e.loaded); }); }
    });
    return aiApi().create(opts).then(function(sess){ aiBaseSession = sess; return sess; });
  }
  function aiPromptJson(base, text, schema){
    var clonePromise = base.clone ? base.clone() : Promise.resolve(base);
    return clonePromise.then(function(sess){
      return sess.prompt(text, { responseConstraint: schema }).then(function(raw){
        if (sess !== base && sess.destroy) sess.destroy();
        var m = String(raw).match(/\{[\s\S]*\}/);
        return JSON.parse(m ? m[0] : raw);
      }, function(err){ if (sess !== base && sess.destroy) sess.destroy(); throw err; });
    });
  }
  function cleanBullets(list, max){ return (list || []).map(function(b){ return String(b).trim(); }).filter(Boolean).slice(0, max); }
  function aiSummarizeAnswer(base, question, answer){
    var parts = questionParts(question);
    var transcript = '\n\nTranscript of the answer:\n' + String(answer).slice(0, 9000);
    if (parts.length === 1){
      return aiPromptJson(base, 'Interview question: ' + question + transcript, AI_Q_SCHEMA).then(function(r){
        var bullets = cleanBullets(r.bullets, 4);
        if (!bullets.length) throw new Error('empty');
        return { sections: [{ title: '', bullets: bullets }], bullets: bullets };
      });
    }
    // Multi-part question: one section per part, in order.
    var schema = { type: 'object', properties: { parts: { type: 'array', minItems: parts.length, maxItems: parts.length, items: AI_Q_SCHEMA } }, required: ['parts'] };
    var text = 'This interview question has ' + parts.length + ' parts:\n' +
      parts.map(function(p, i){ return 'Part ' + (i + 1) + ': ' + p; }).join('\n') +
      '\n\nThe candidate usually answers the parts in order, but may mix them. Sort what they said by which part it answers. ' +
      'Return "parts" with exactly ' + parts.length + ' entries in the same order, each with 1 to 3 bullets for that part only. ' +
      'If they never addressed a part, give that part an empty list.' + transcript;
    return aiPromptJson(base, text, schema).then(function(r){
      var arr = r.parts || [];
      var sections = parts.map(function(title, i){ var x = arr[i] || {}; return { title: title, bullets: cleanBullets(x.bullets, 3) }; });
      var bullets = [].concat.apply([], sections.map(function(x){ return x.bullets; }));
      if (!bullets.length) throw new Error('empty');
      return { sections: sections, bullets: bullets };
    });
  }
  function aiSummarizeOverall(base, name, perQ){
    var body = perQ.map(function(x){
      return 'Q: ' + x.question + '\n' + x.bullets.map(function(b){ return '- ' + b; }).join('\n');
    }).join('\n\n');
    var text = 'Here are notes from every answer in ' + name + '’s interview.\n\n' + body +
      '\n\nNow write the overall picture for the exec board: "overview" = 1–2 sentences on who this candidate is and how the interview went; ' +
      '"strengths" = up to 4 short bullets on what stood out positively; "concerns" = up to 3 short bullets on weak spots, vague answers, or things to follow up on (empty if none). Base everything only on these notes.';
    return aiPromptJson(base, text, AI_OVERALL_SCHEMA);
  }
  function formatOverall(name, coveredLine, r){
    var out = coveredLine + '\n\n' + (r.overview ? String(r.overview).trim() + '\n\n' : '');
    if (r.strengths && r.strengths.length) out += 'Strengths:\n' + r.strengths.map(function(b){ return '• ' + b; }).join('\n') + '\n\n';
    if (r.concerns && r.concerns.length) out += 'Concerns / follow up on:\n' + r.concerns.map(function(b){ return '• ' + b; }).join('\n') + '\n\n';
    return out.trim();
  }

  // Drives the review screen: writes AI summaries into each card as they
  // finish, without touching any summary the reviewer has already edited.
  function setAiStatus(html, showBtn, btnLabel){
    var el = document.getElementById('ai-status-text');
    var btn = document.getElementById('ai-run-btn');
    if (el) el.innerHTML = html;
    if (btn){ btn.hidden = !showBtn; if (btnLabel) btn.textContent = btnLabel; }
  }
  function aiCheckAndMaybeRun(){
    var d = reviewDraft;
    if (d && d.aiDone){ setAiStatus('✨ AI summaries done — written on this computer by Chrome’s built-in AI. Double-check them and edit anything that’s off.', true, '↻ Redo AI summaries'); return; }
    aiAvailability().then(function(av){
      if (reviewDraft !== d) return;
      d.aiAvailability = av;
      if (av === 'available') runAiSummaries(false);
      else if (av === 'downloadable' || av === 'downloading' || av === 'after-download')
        setAiStatus('<strong>AI summaries are ready to turn on.</strong> Chrome needs a one-time download of its built-in AI model (it stays on this computer). Showing quick key lines until then.', true, '✨ Turn on AI summaries');
      else if (av === 'unsupported')
        setAiStatus('AI summaries need an up-to-date <strong>Google Chrome</strong> on a laptop/desktop. Showing quick key lines instead — you can edit them.', false);
      else
        setAiStatus('This computer can’t run Chrome’s built-in AI (it needs about 16 GB of RAM and ~22 GB of free disk space). Showing quick key lines instead — you can edit them.', false);
    });
  }
  function runAiSummaries(force){
    var d = reviewDraft;
    if (!d || d.aiRunning) return;
    d.aiRunning = true;
    setAiStatus('✨ Starting AI…', false);
    aiGetSession(function(frac){
      if (reviewDraft === d) setAiStatus('✨ Downloading Chrome’s AI model (one time only)… ' + Math.round((frac || 0) * 100) + '%', false);
    }).then(function(base){
      var todo = d.qa.map(function(qa, i){ return i; }).filter(function(i){ return d.qa[i].answerText && d.qa[i].answerText.trim(); });
      var perQ = [];
      var n = 0;
      return todo.reduce(function(chain, i){
        return chain.then(function(){
          if (reviewDraft !== d) return;
          n++;
          setAiStatus('✨ Writing AI summaries… (' + n + ' of ' + todo.length + ')', false);
          var qa = d.qa[i];
          return aiSummarizeAnswer(base, qa.questionText, qa.answerText).then(function(r){
            perQ.push({ question: qa.questionText, bullets: r.bullets });
            if (force || !qa.summaryEdited){
              qa.summary = formatSections(r.sections);
              qa.summaryEdited = false;
              var ta = document.querySelector('textarea.summary[data-i="' + i + '"]');
              if (ta){ ta.value = qa.summary; autosizeQ(ta); }
            }
          }, function(){ /* keep the key-lines fallback for this one */ });
        });
      }, Promise.resolve()).then(function(){
        if (reviewDraft !== d) return;
        if (!perQ.length){ setAiStatus('The AI didn’t have enough transcript to summarize — showing key lines instead.', true, '↻ Try AI again'); return; }
        setAiStatus('✨ Writing the overall summary…', false);
        var answered = d.qa.filter(function(x){ return x.asked && x.answerText.trim(); }).length;
        var covered = d.candidateName + ' — ' + answered + ' of ' + d.qa.length + ' bank questions covered.';
        return aiSummarizeOverall(base, d.candidateName, perQ).then(function(r){
          if (reviewDraft !== d) return;
          if (force || !d.overallEdited){
            d.overallSummary = formatOverall(d.candidateName, covered, r);
            d.overallEdited = false;
            var ta = document.getElementById('rv-overall');
            if (ta){ ta.value = d.overallSummary; autosizeQ(ta); }
          }
        }, function(){}).then(function(){
          d.aiDone = true;
          if (reviewDraft === d) setAiStatus('✨ AI summaries done — written on this computer by Chrome’s built-in AI. Double-check them and edit anything that’s off.', true, '↻ Redo AI summaries');
        });
      });
    }).catch(function(err){
      if (reviewDraft === d) setAiStatus('Couldn’t start Chrome’s AI (' + escapeHtml((err && (err.name || err.message)) || 'error') + '). Showing quick key lines instead.', true, '↻ Try AI again');
    }).then(function(){ d.aiRunning = false; });
  }

  /* ============================================================
     Google Sheets sync (standalone hosting has no Claude artifact
     capability to lean on, so a Google Sheet — via a small Apps
     Script web app — is the shared backend instead). SHEETS_URL is
     baked in at build time from config.json; when it's blank, the
     app runs local-only (this device's browser storage) and every
     save just says so, rather than failing.
     ============================================================ */
  var SHEETS_URL = (typeof window.__SHEETS_URL__ === 'string') ? window.__SHEETS_URL__.trim() : '';
  var LOCAL_KEY = 'tamid_interview_state_v1';

  function sheetsConfigured(){ return /^https:\/\//.test(SHEETS_URL); }

  function saveLocal(s){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch(e){}
  }
  function loadLocal(){
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : null;
    } catch(e){ return null; }
  }

  function setSyncIndicator(on, label){
    var el = document.getElementById('sync-indicator');
    if (!el) return;
    el.hidden = !on;
    var textEl = el.querySelector('.sync-label');
    if (textEl && label) textEl.textContent = label;
  }

  // Pulls the latest candidates/questions/interviews from the Sheet. Never
  // throws outward — on any failure it just leaves whatever's already
  // loaded (cached copy or bundled seed data) in place and says so.
  function syncFromSheets(showToastOnFail){
    if (!sheetsConfigured()) return Promise.resolve(false);
    setSyncIndicator(true, 'syncing…');
    return fetch(SHEETS_URL, { method: 'GET', cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        if (data && Array.isArray(data.candidates)) state.candidates = data.candidates;
        if (data && Array.isArray(data.questions)) state.questions = data.questions;
        if (data && Array.isArray(data.interviews)) state.interviews = data.interviews;
        saveLocal(state);
        setSyncIndicator(false);
        return true;
      })
      .catch(function(err){
        setSyncIndicator(false);
        if (showToastOnFail) toast('Couldn’t reach the Google Sheet (' + (err && err.message ? err.message : 'network error') + ') — showing the last saved copy on this device.', 'warn');
        return false;
      });
  }

  // Pushes one change up to the Sheet. `kind` is 'interview' | 'candidates' | 'questions'.
  // POST body is sent as text/plain on purpose — Apps Script can't answer a
  // CORS preflight, and a text/plain body is a "simple request" that skips it.
  function pushToSheets(kind, payload){
    if (!sheetsConfigured()) return Promise.resolve({ ok:false, offline:true });
    var body = Object.assign({ type: kind }, payload);
    return fetch(SHEETS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    })
      .then(function(res){ return res.json().catch(function(){ return { ok:true }; }); })
      .catch(function(err){ return { ok:false, error: (err && err.message) || 'network error' }; });
  }

  // Applies newState locally right away (so the UI and this device never
  // wait on the network), then tries to push the relevant piece to the
  // Sheet in the background. `kind` picks what gets sent: 'interview'
  // (default — the just-submitted interview), 'candidates', or 'questions'.
  function publishState(newState, successMsg, kind){
    state = newState;
    saveLocal(state);
    renderView();
    if (!sheetsConfigured()){
      toast((successMsg || 'Saved') + ' — on this device only (no Google Sheet connected yet).', 'warn');
      return Promise.resolve();
    }
    setSyncIndicator(true, 'saving…');
    var payload = kind === 'candidates' ? { candidates: newState.candidates }
                : kind === 'questions' ? { questions: newState.questions }
                : { interview: newState.interviews[newState.interviews.length - 1] };
    return pushToSheets(kind || 'interview', payload).then(function(result){
      setSyncIndicator(false);
      if (result && result.ok){
        toast(successMsg || 'Saved', 'success');
      } else {
        toast('Saved on this device, but the Google Sheet didn’t update (' + (result && result.error ? result.error : 'connection issue') + '). Try “Refresh from Sheet” once you’re back online, or use the copy/export buttons as backup.', 'warn');
      }
    });
  }

  // Exports copy plain text to the clipboard rather than saving a file. That's
  // deliberate: a page that can push file downloads can't be turned on for
  // "anyone with the link" sharing, and this app needs to be link-shareable
  // with two interviewers. Clipboard copy needs no special capability.
  function copyText(text, successLabel){
    return new Promise(function(resolve){
      function ok(){ toast((successLabel || 'Copied') + ' — paste it into a spreadsheet or document.', 'success'); resolve(true); }
      function fail(){ toast('Couldn’t copy automatically — select the text in the box and copy it manually.', 'warn'); resolve(false); }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(ok).catch(fail);
      } else {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          var didCopy = document.execCommand('copy');
          document.body.removeChild(ta);
          didCopy ? ok() : fail();
        } catch (e) { fail(); }
      }
    });
  }

  /* ============================================================
     Toasts
     ============================================================ */
  function toast(msg, kind){
    var root = document.getElementById('toast-root');
    if (!root) return;
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' toast-' + kind : '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.remove(); }, 4200);
  }

  // Native confirm()/alert() are unreliable inside the artifact frame (some
  // hosts suppress them entirely, which makes a button relying on confirm()
  // look simply unresponsive) — this in-page modal is the reliable version.
  function showConfirm(message, confirmLabel, onConfirm){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,16,24,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;';
    overlay.innerHTML =
      '<div class="card" style="max-width:360px;width:100%;">' +
        '<div class="card-pad">' +
          '<p style="margin-bottom:18px;line-height:1.5;">' + escapeHtml(message) + '</p>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;">' +
            '<button class="btn btn-sm" id="confirm-cancel">Cancel</button>' +
            '<button class="btn btn-sm btn-danger" id="confirm-ok">' + escapeHtml(confirmLabel || 'Confirm') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    overlay.querySelector('#confirm-cancel').addEventListener('click', close);
    overlay.querySelector('#confirm-ok').addEventListener('click', function(){ close(); onConfirm(); });
  }

  /* ============================================================
     CSV export
     ============================================================ */
  function csvValue(v){
    var s = (v === undefined || v === null) ? '' : String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function rowsToCsv(rows){
    return rows.map(function(r){ return r.map(csvValue).join(','); }).join('\r\n');
  }
  function exportAllCsv(){
    var rows = [['Candidate Name','Question Text','Audio Link','Transcription','AI Summary','Interviewer Name','Submitted At']];
    state.interviews.forEach(function(iv){
      if (iv.openingRemarks && iv.openingRemarks.trim()){
        rows.push([iv.candidateName, '(opening remarks / other)', '', iv.openingRemarks, '', iv.submittedBy, fmtDate(iv.submittedAt)]);
      }
      iv.qa.forEach(function(qa){
        if (!qa.asked && !qa.answerText.trim()) return;
        rows.push([iv.candidateName, qa.questionText, '', qa.answerText, qa.summary || '', iv.submittedBy, fmtDate(iv.submittedAt)]);
      });
    });
    copyText(rowsToCsv(rows), 'Spreadsheet data copied');
  }
  function exportScoresCsv(){
    var header = ['Candidate Name'].concat(RUBRIC.map(function(r){ return r.name; }), ['Total (/' + RUBRIC_MAX + ')', 'Asked us questions?', 'Fund or Consulting', 'Red flags / concerns', 'Rated by', 'Submitted At']);
    var rows = [header];
    state.interviews.filter(function(iv){ return iv.rating; }).forEach(function(iv){
      var rt = iv.rating;
      rows.push([iv.candidateName].concat(RUBRIC.map(function(r){ return (rt.scores[r.key] && rt.scores[r.key].score) || ''; }),
        [rt.total, rt.askedQuestions === 'yes' ? 'Yes' : rt.askedQuestions === 'no' ? 'No' : '', rt.track || '', rt.redFlags || '', rt.ratedBy || iv.submittedBy, fmtDate(iv.submittedAt)]));
    });
    if (rows.length === 1){ toast('No rated interviews yet.', 'warn'); return; }
    copyText(rowsToCsv(rows), 'Scores copied — paste into Google Sheets');
  }
  function ratingHtml(rt){
    if (!rt) return '';
    var flags = ratingFlags(rt);
    return '<h4>Evaluation — ' + rt.total + ' / ' + (rt.max || RUBRIC_MAX) + '</h4>' +
      '<table style="margin-bottom:10px;"><tbody>' + RUBRIC.map(function(r){
        var x = rt.scores[r.key] || {};
        return '<tr><td style="width:45%;">' + escapeHtml(r.name) + '</td><td class="mono" style="width:60px;"><strong>' + (x.score || '—') + '</strong>/10</td><td style="white-space:pre-wrap;">' + escapeHtml(x.notes || '') + '</td></tr>';

      '<p style="margin-bottom:6px;"><strong>Asked us questions:</strong> ' + (rt.askedQuestions === 'yes' ? 'Yes' : '<span style="color:var(--live);font-weight:600;">No — red flag</span>') +
      ' &nbsp;·&nbsp; <strong>Fund or Consulting:</strong> ' + escapeHtml(rt.track || '—') + '</p>' +
      (rt.redFlags ? '<p style="margin-bottom:18px;white-space:pre-wrap;"><strong style="color:var(--live);">Red flags / concerns:</strong> ' + escapeHtml(rt.redFlags) + '</p>' : '<div style="margin-bottom:18px;"></div>') +
      '';
  }
  function ratingText(rt){
    if (!rt) return [];
    var lines = ['', 'EVALUATION — ' + rt.total + ' / ' + (rt.max || RUBRIC_MAX)];
    RUBRIC.forEach(function(r){ var x = rt.scores[r.key] || {}; lines.push(r.name + ': ' + (x.score || '—') + '/10' + (x.notes ? ' — ' + x.notes : '')); });
    lines.push('Asked us questions: ' + (rt.askedQuestions === 'yes' ? 'Yes' : 'No (red flag)'));
    lines.push('Fund or Consulting: ' + (rt.track || '—'));
    if (rt.redFlags) lines.push('Red flags / concerns: ' + rt.redFlags);

  function exportInterviewCsv(iv){
    var rows = [['Candidate Name','Question Text','Audio Link','Transcription','AI Summary','Interviewer Name']];
    if (iv.openingRemarks && iv.openingRemarks.trim()) rows.push([iv.candidateName, '(opening remarks / other)', '', iv.openingRemarks, '', iv.submittedBy]);
    iv.qa.forEach(function(qa){

      rows.push([iv.candidateName, qa.questionText, '', qa.answerText, qa.summary || '', iv.submittedBy]);

  function safeFilename(s){
    return (s || 'interview').replace(/[^a-z0-9\-_]+/gi, '-').replace(/^-+|-+$/g,'').toLowerCase() || 'interview';

  function buildInterviewDocText(iv){
    var lines = [];
    lines.push(iv.candidateName);
    lines.push('Interviewed by ' + (iv.submittedBy || 'Unknown') + '  ·  ' + fmtDate(iv.submittedAt) + '  ·  Duration ' + fmtDuration(iv.durationSec));
    lines.push('');
    lines.push('SUMMARY');
    lines.push(iv.overallSummary || '—');
    ratingText(iv.rating).forEach(function(l){ lines.push(l); });
    if (iv.openingRemarks && iv.openingRemarks.trim()){
      lines.push('');
      lines.push('OPENING REMARKS / OTHER');
      lines.push(iv.openingRemarks);
    }
    lines.push('');
    lines.push('QUESTIONS & ANSWERS');
    iv.qa.filter(function(q){ return q.asked || q.answerText.trim(); }).forEach(function(qa){
      lines.push('');
      lines.push('Q: ' + qa.questionText + (qa.asked ? '' : '  (not confidently detected)'));
      lines.push('A: ' + (qa.answerText || '—'));
      if (qa.summary) lines.push('Summary:\n' + qa.summary);

  /* ============================================================
     Excel import (SheetJS) for the roster & question bank
     ============================================================ */
  function sheetRows(ws){
    return (window.XLSX ? XLSX.utils.sheet_to_json(ws, { header:1, defval:'' }) : []);
  }
  function findHeaderRow(rows, mustContainAny){
    for (var i=0;i<Math.min(rows.length,10);i++){
      var row = rows[i].map(function(c){ return String(c||'').toLowerCase(); });
      for (var j=0;j<mustContainAny.length;j++){
        if (row.some(function(cell){ return cell.indexOf(mustContainAny[j]) !== -1; })) return i;
      }
    }
    return -1;
  }
  function colIndex(headerRow, names){
    var lower = headerRow.map(function(c){ return String(c||'').toLowerCase().trim(); });
    for (var i=0;i<names.length;i++){
      for (var j=0;j<lower.length;j++){ if (lower[j].indexOf(names[i]) !== -1) return j; }
    }
    return -1;
  }
  function importCandidatesFromWorkbook(wb){
    var found = null;
    wb.SheetNames.forEach(function(name){
      if (found) return;
      var rows = sheetRows(wb.Sheets[name]);
      var hi = findHeaderRow(rows, ['candidate','name']);
      if (hi !== -1) found = { rows: rows, hi: hi };
    });
    if (!found){ toast('Couldn’t find a candidate name column in that file.', 'error'); return; }
    var header = found.rows[found.hi];
    var iName = colIndex(header, ['candidate name','name']);
    var iEmail = colIndex(header, ['email']);
    var iDate = colIndex(header, ['date']);
    var iSlot = colIndex(header, ['time slot','time']);
    var iInterviewer = colIndex(header, ['interviewer']);
    var iNotetaker = colIndex(header, ['notetaker','note taker']);
    var out = [];
    for (var r=found.hi+1; r<found.rows.length; r++){
      var row = found.rows[r];
      var name = iName!==-1 ? String(row[iName]||'').trim() : '';
      if (!name) continue;
      out.push({
        id: uid('cand'),
        name: name,
        email: iEmail!==-1 ? String(row[iEmail]||'').trim() : '',
        date: iDate!==-1 ? String(row[iDate]||'').trim() : '',
        timeSlot: iSlot!==-1 ? String(row[iSlot]||'').trim() : '',
        interviewer: iInterviewer!==-1 ? String(row[iInterviewer]||'').trim() : '',
        notetaker: iNotetaker!==-1 ? String(row[iNotetaker]||'').trim() : ''
      });
    }
    if (!out.length){ toast('No candidate rows found under that header.', 'error'); return; }
    draftCandidates = out;
    toast('Loaded ' + out.length + ' candidate' + (out.length===1?'':'s') + ' from the file — review, then Save changes.', 'success');
    renderView();
  }
  function importQuestionsFromWorkbook(wb){
    var found = null;
    wb.SheetNames.forEach(function(name){
      if (found) return;
      var rows = sheetRows(wb.Sheets[name]);
      var hi = findHeaderRow(rows, ['question']);
      if (hi !== -1) found = { rows: rows, hi: hi };
    });
    if (!found){ toast('Couldn’t find a question column in that file.', 'error'); return; }
    var header = found.rows[found.hi];
    var iText = colIndex(header, ['question text','question']);
    var iGroup = colIndex(header, ['group','choose one','set']);
    var out = [];
    for (var r=found.hi+1; r<found.rows.length; r++){
      var row = found.rows[r];
      var text = iText!==-1 ? String(row[iText]||'').trim() : '';
      if (!text) continue;
      var group = iGroup!==-1 ? String(row[iGroup]||'').trim() : '';
      out.push({ id: uid('q'), number: out.length+1, text: text, group: group });
    }
    if (!out.length){ toast('No question rows found under that header.', 'error'); return; }
    draftQuestions = out;
    toast('Loaded ' + out.length + ' question' + (out.length===1?'':'s') + ' from the file — review, then Save changes.', 'success');
    renderView();
  }

  function initShell(){
    document.getElementById('shell-root').innerHTML = BODY_SHELL_HTML;

    var unlocked = false;
    try { unlocked = sessionStorage.getItem('tamid_unlocked') === '1'; } catch (e) {}

    document.getElementById('lock-screen').hidden = unlocked;
    document.getElementById('app-shell').hidden = !unlocked;

    document.getElementById('lock-form').addEventListener('submit', function(e){
      e.preventDefault();

        document.getElementById('lock-screen').hidden = true;

        boot();
      } else {
        document.getElementById('lock-error').hidden = false;
      }

  function boot(){
    // Show whatever we've got immediately (bundled seed data, or a locally
    // cached copy from a previous sync) — then refresh from the Sheet in
    // the background so the UI never sits on a blank screen waiting.
    var cached = loadLocal();
    if (cached) state = cached;
    currentView = 'dashboard';

  /* ============================================================
     View dispatch
     ============================================================ */
  var TITLES = { dashboard: 'Dashboard', 'new-interview': 'New Interview', manage: 'Candidates & Questions' };

  function updateNavActive(){
    Array.prototype.forEach.call(document.querySelectorAll('.nav-btn[data-nav]'), function(btn){
      btn.classList.toggle('active', btn.dataset.nav === currentView);
    });
  }

  function renderView(){
    var oldRoot = document.getElementById('view-root');
    if (!oldRoot) return;
    // Swap in a fresh, listener-free container before wiring it up again —
    // each wireX() below attaches delegated listeners to #view-root, and
    // since the element itself normally persists across renders (only its
    // innerHTML changes), reusing it would stack duplicate listeners from
    // every previous render. Cloning (shallow) drops any listeners the old
    // node carried while keeping the same id/position in the page.
    var root = oldRoot.cloneNode(false);
    oldRoot.parentNode.replaceChild(root, oldRoot);

    updateNavActive();
    var titleEl = document.getElementById('topbar-title');
    if (titleEl) titleEl.textContent = TITLES[currentView] || '';

    if (currentView === 'dashboard'){ root.innerHTML = renderDashboardHtml(); wireDashboard(); }
    else if (currentView === 'manage'){ root.innerHTML = renderManageHtml(); wireManage(); }
    else if (currentView === 'new-interview'){ root.innerHTML = renderNewInterviewHtml(); wireNewInterview(); }
  }

  /* ============================================================

  function wireDashboard(){
    var root = document.getElementById('view-root');
    root.addEventListener('click', function(e){
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var action = btn.dataset.action;
      if (action === 'export-all') exportAllCsv();
      else if (action === 'sort-newest'){ dashSort = 'newest'; renderView(); }
      else if (action === 'sort-score'){ dashSort = 'score'; renderView(); }
      else if (action === 'export-scores') exportScoresCsv();
      else if (action === 'view-doc'){
        var iv = state.interviews.find(function(x){ return x.id === btn.dataset.id; });
        if (iv) openDocModal(iv);
      } else if (action === 'export-csv'){
        var iv2 = state.interviews.find(function(x){ return x.id === btn.dataset.id; });
        if (iv2) exportInterviewCsv(iv2);
      } else if (action === 'refresh-sheet'){
        syncFromSheets(true).then(function(ok){ if (ok) toast('Refreshed from the Sheet.', 'success'); renderView(); });
      }
    });
  }

    ) +

  function autosizeQ(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

  function wireManage(){
    var root = document.getElementById('view-root');
    root.querySelectorAll('textarea.q-edit').forEach(autosizeQ);
    if (!window.__qResizeBound){
      window.__qResizeBound = true;
      window.addEventListener('resize', function(){ document.querySelectorAll('textarea.q-edit').forEach(autosizeQ); });
    }

    root.addEventListener('input', function(e){
      var t = e.target;
      if (t.classList && t.classList.contains('q-edit')) autosizeQ(t);
      if (t.dataset && t.dataset.field !== undefined && t.dataset.i !== undefined){
        var i = parseInt(t.dataset.i, 10);
        if (root.contains(document.getElementById('tab-candidates')) && draftCandidates[i] && (t.dataset.field in draftCandidates[i])){
          draftCandidates[i][t.dataset.field] = t.value;
        } else if (draftQuestions[i] && (t.dataset.field in draftQuestions[i])){
          draftQuestions[i][t.dataset.field] = t.value;
        }
      }
    });

    root.addEventListener('click', function(e){
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var action = btn.dataset.action;
      var i = btn.dataset.i !== undefined ? parseInt(btn.dataset.i, 10) : -1;

      if (action === 'tab-candidates'){ manageTab = 'candidates'; renderView(); }
      else if (action === 'tab-questions'){ manageTab = 'questions'; renderView(); }
      else if (action === 'refresh-sheet'){
        syncFromSheets(true).then(function(ok){ draftCandidates = null; draftQuestions = null; if (ok) toast('Refreshed from the Sheet.', 'success'); renderView(); });
      }
      else if (action === 'add-candidate'){
        draftCandidates.push({ id: uid('cand'), name:'', email:'', date:'', timeSlot:'', interviewer:'', notetaker:'' });
        renderView();
      }
      else if (action === 'del-candidate'){ draftCandidates.splice(i,1); renderView(); }
      else if (action === 'add-question'){
        draftQuestions.push({ id: uid('q'), number: draftQuestions.length+1, text:'', group: '' });
        renderView();
      }
      else if (action === 'del-question'){ draftQuestions.splice(i,1); renderView(); }
      else if (action === 'q-up' && i > 0){ var tmp=draftQuestions[i-1]; draftQuestions[i-1]=draftQuestions[i]; draftQuestions[i]=tmp; renderView(); }
      else if (action === 'q-down' && i < draftQuestions.length-1){ var tmp2=draftQuestions[i+1]; draftQuestions[i+1]=draftQuestions[i]; draftQuestions[i]=tmp2; renderView(); }
      else if (action === 'save-candidates'){
        var cleaned = draftCandidates.filter(function(c){ return c.name && c.name.trim(); });
        var ns = deepClone(state); ns.candidates = cleaned;
        publishState(ns, 'Roster saved (' + cleaned.length + ' candidates)', 'candidates').then(function(){ draftCandidates = null; });
      }
      else if (action === 'save-questions'){
        var cleanedQ = draftQuestions.filter(function(q){ return q.text && q.text.trim(); }).map(function(q,idx){ q.number = idx+1; return q; });
        var ns2 = deepClone(state); ns2.questions = cleanedQ;
        publishState(ns2, 'Question bank saved (' + cleanedQ.length + ' questions)', 'questions').then(function(){ draftQuestions = null; });
      }
    });

    var upC = document.getElementById('upload-candidates');
    if (upC) upC.addEventListener('change', function(e){ handleWorkbookUpload(e, importCandidatesFromWorkbook); });
    var upQ = document.getElementById('upload-questions');
    if (upQ) upQ.addEventListener('change', function(e){ handleWorkbookUpload(e, importQuestionsFromWorkbook); });
  }

  function handleWorkbookUpload(e, handler){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!window.XLSX){ toast('The spreadsheet reader hasn’t finished loading — try again in a moment.', 'error'); return; }
    file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, { type:'array' });
      handler(wb);
    }).catch(function(){ toast('Couldn’t read that file.', 'error'); });
    e.target.value = '';
  }

  /* ---------- Recording ---------- */
