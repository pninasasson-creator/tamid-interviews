  function cancelRecordingToSetup(){
    showConfirm('Leave this interview? The in-progress recording will be discarded and not saved.', 'Leave', function(){
      if (recSession){ recSession.shouldRestart = false; if (recSession.recognition){ try { recSession.recognition.stop(); } catch(e){} } stopTimer(); }
      recSession = null;
      forcePasteMode = false;
      niStep = 'setup';
      renderView();
    });
  }

  function wireRecording(){
    var srSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    var backBtn = document.getElementById('back-to-setup');
    if (backBtn) backBtn.addEventListener('click', cancelRecordingToSetup);
    if (!srSupported || forcePasteMode){
      document.getElementById('fallback-finish').addEventListener('click', function(){
        var text = document.getElementById('fallback-transcript').value.trim();
        var utterances = (text.match(/[^.!?\n]+[.!?]*/g) || []).map(function(s){ return s.trim(); }).filter(Boolean);
        finishSession(utterances, text);
      });
      return;
    }
    document.getElementById('stop-btn').addEventListener('click', stopRecording);
    document.getElementById('next-q-btn').addEventListener('click', skipToNextQuestion);
    document.getElementById('q-rail').addEventListener('click', function(e){
      var item = e.target.closest('.q-rail-item');
      if (item) jumpToQuestion(item.dataset.qid);
    });
    if (!window.__nextQKeyBound){
      window.__nextQKeyBound = true;
      document.addEventListener('keydown', function(e){
        if (e.key !== 'ArrowRight' || niStep !== 'recording' || !recSession || !document.getElementById('next-q-btn')) return;
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        e.preventDefault();
        skipToNextQuestion();
      });
    }
    var switchBtn = document.getElementById('switch-to-paste');
    if (switchBtn) switchBtn.addEventListener('click', function(){
      if (recSession){ recSession.shouldRestart = false; if (recSession.recognition){ try { recSession.recognition.stop(); } catch(e){} } stopTimer(); }
      forcePasteMode = true;
      renderView();
    });
  }

  function startTimer(){
    stopTimer();
    recSession.timerHandle = setInterval(function(){
      var el = document.getElementById('rec-timer');
      if (el) el.textContent = fmtDuration((Date.now() - recSession.startedAt) / 1000);
    }, 500);
  }
  function stopTimer(){ if (recSession && recSession.timerHandle) clearInterval(recSession.timerHandle); }

  var MIC_ERROR_MESSAGES = {
    'not-allowed': 'Microphone blocked — allow mic access for this page (check the address-bar icon) and press Stop, then start a new interview.',
    'service-not-allowed': 'Microphone blocked by the browser/OS — allow mic access and try again.',
    'audio-capture': 'No microphone found — check a mic is connected and try again.',
    'network': 'Lost connection to the speech service — will keep retrying.',
    'no-speech': null, // routine — happens during normal silence, not an error worth surfacing
    'aborted': null
  };

  function setMicStatus(text, cls){
    var el = document.getElementById('mic-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'hint' + (cls ? ' ' + cls : '');
  }

  function startRecording(){
    recSession = { startedAt: Date.now(), utterances: [], jumps: [], recognition: null, shouldRestart: false, timerHandle: null };
    startTimer();

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;

    // Request the microphone directly first. This exists purely for diagnosis:
    // getUserMedia gives a specific, standard error name/message, where
    // SpeechRecognition's own permission handling can fail silently. If this
    // never even shows a system permission prompt, that points to something
    // blocking mic access before the browser asks — not a setting to fix here.
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      setMicStatus('requesting microphone access…');
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        stream.getTracks().forEach(function(t){ t.stop(); }); // only needed the permission check
        beginSpeechRecognition(SR);
      }).catch(function(err){
        var name = (err && err.name) || 'Error';
        var detail =
          name === 'NotAllowedError' ? 'blocked — this browser view isn’t allowed to use the microphone here' :
          name === 'NotFoundError' ? 'no microphone found on this device' :
          name === 'NotReadableError' ? 'microphone is in use by another app' :
          (err && err.message) || name;
        setMicStatus('microphone unavailable: ' + detail + ' (' + name + ')', 'mic-error');
        toast('Microphone unavailable (' + name + '). Try “Switch to paste transcript” below, or open this app in its own browser tab if you haven’t already.', 'error');
      });
    } else {
      beginSpeechRecognition(SR);
    }
  }

  function beginSpeechRecognition(SR){
    if (!recSession) return;
    var rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';

    rec.onstart = function(){ setMicStatus('listening…'); };
    rec.onspeechstart = function(){ setMicStatus('hearing you…', 'mic-active'); };
    rec.onspeechend = function(){ setMicStatus('listening…'); };
    rec.onresult = function(e){
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++){
        var res = e.results[i];
        var text = applyWordCorrections((res[0].transcript || '').trim());
        if (res.isFinal){ if (text) onFinalUtterance(text); }
        else interim += text + ' ';
      }
      renderTranscript(interim);
    };
    rec.onerror = function(e){
      var known = MIC_ERROR_MESSAGES.hasOwnProperty(e.error) ? MIC_ERROR_MESSAGES[e.error] : ('microphone error (' + e.error + ')');
      if (known) setMicStatus(known, 'mic-error');
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture'){
        toast('Microphone problem: ' + (known || e.error) + '. You can switch to paste-transcript mode below.', 'error');
        recSession.shouldRestart = false;
      }
    };
    rec.onend = function(){
      if (recSession && recSession.shouldRestart){
        try { rec.start(); } catch(e){ setMicStatus('microphone stopped unexpectedly — try “Switch to paste transcript.”', 'mic-error'); }
      }
    };
    recSession.recognition = rec;
    recSession.shouldRestart = true;
    try { rec.start(); } catch (e) {
      setMicStatus('couldn’t start the microphone — try “Switch to paste transcript” below.', 'mic-error');
      toast('Couldn’t start the microphone.', 'error');
    }
  }

  function onFinalUtterance(text){
    recSession.utterances.push(text);
    var draft = runMatching(recSession.utterances, state.questions, recSession.jumps);
    recSession.draft = draft;
    updateQRail(draft);
    renderTranscript('');
  }

  // Manual override: everything said from now on belongs to this question
  // (auto-detection keeps running afterwards).
  function jumpToQuestion(qid){
    if (!recSession || !qid) return;
    recSession.jumps.push({ at: recSession.utterances.length, questionId: qid });
    recSession.draft = runMatching(recSession.utterances, state.questions, recSession.jumps);
    updateQRail(recSession.draft);
  }
  function skipToNextQuestion(){
    if (!recSession) return;
    var draft = recSession.draft || runMatching(recSession.utterances, state.questions, recSession.jumps);
    var qs = state.questions;
    var cur = -1;
    qs.forEach(function(q, i){ if (q.id === draft.currentQuestionId) cur = i; });
    if (cur >= qs.length - 1){ toast('That’s the last question — press Stop & review when you’re done.'); return; }
    jumpToQuestion(qs[cur + 1].id);
  }

  function updateQRail(draft){
    var rail = document.getElementById('q-rail');
    if (!rail) return;
    var byId = {};
    draft.qa.forEach(function(q){ byId[q.questionId] = q; });
    Array.prototype.forEach.call(rail.querySelectorAll('.q-rail-item'), function(item){
      var q = byId[item.dataset.qid];
      var dot = item.querySelector('.q-dot');
      item.classList.remove('current', 'done');
      if (dot) dot.textContent = '';
      if (!q || !q.asked) return;
      if (q.questionId === draft.currentQuestionId){
        item.classList.add('current');
      } else {
        item.classList.add('done');
        if (dot) dot.textContent = '✓';
      }
    });
  }

  function renderTranscript(interim){
    var panel = document.getElementById('transcript-panel');
    if (!panel || !recSession) return;
    var lines = recSession.utterances.map(function(u){ return '<div class="transcript-line">' + escapeHtml(u) + '</div>'; }).join('');
    panel.innerHTML = (lines || '<p class="hint">Listening… speak naturally, questions are detected automatically as you ask them (no need to read them word-for-word).</p>') +
      (interim ? '<div class="transcript-line transcript-interim">' + escapeHtml(interim) + '</div>' : '');
    panel.scrollTop = panel.scrollHeight;
  }

  function stopRecording(){
    if (!recSession) return;
    recSession.shouldRestart = false;
    if (recSession.recognition){ try { recSession.recognition.stop(); } catch(e){} }
    stopTimer();
    recSession.endedAt = Date.now();
    var draft = runMatching(recSession.utterances, state.questions, recSession.jumps);
    finishSession(recSession.utterances, null, draft);
  }

  function finishSession(utterances, rawPastedText, precomputedDraft){
    var draft = precomputedDraft || runMatching(utterances, state.questions);
    var qa = draft.qa.map(function(q){
      return { questionId: q.questionId, questionText: q.questionText, group: q.group || '', asked: q.asked, answerText: q.answerText, summary: summarizeFor(q.questionText, q.answerText) };
    });
    reviewDraft = {
      candidateName: setupPick.candidateName,
      submittedBy: setupPick.submittedBy,
      opening: draft.opening,
      qa: qa,
      overallSummary: buildOverallSummary(setupPick.candidateName, qa, draft.opening),
      rawTranscript: rawPastedText || utterances.join('\n'),
      startedAt: recSession ? recSession.startedAt : Date.now(),
      endedAt: recSession ? (recSession.endedAt || Date.now()) : Date.now()
    };
    niStep = 'review';
    renderView();
  }


  /* ---------- Rating (Interview Evaluation rubric) ---------- */
  function renderRatingHtml(){
    var d = reviewDraft;
    if (!d) return '<p class="hint">Nothing to rate yet.</p>';
    var rt = d.rating || (d.rating = blankRating());
    var rows = RUBRIC.map(function(r){
      var cur = rt.scores[r.key] || { score:null, notes:'' };
      var btns = '';
      for (var n = 1; n <= 10; n++){
        var band = n <= 3 ? 'low' : n <= 7 ? 'mid' : 'high';
        btns += '<button type="button" class="score-btn band-' + band + (cur.score === n ? ' on' : '') + '" data-key="' + r.key + '" data-score="' + n + '" aria-pressed="' + (cur.score === n) + '">' + n + '</button>';
      }
      return '<div class="rubric-row' + (cur.score ? ' done' : '') + '" data-row="' + r.key + '">' +
        '<div class="rubric-head"><div><div class="rubric-name">' + escapeHtml(r.name) + '</div><div class="rubric-criteria">' + escapeHtml(r.criteria) + '</div></div>' +
          '<div class="rubric-score-now" id="now-' + r.key + '">' + (cur.score ? cur.score + '<span>/10</span>' : '—') + '</div></div>' +
        '<div class="score-row" role="group" aria-label="' + escapeHtml(r.name) + ' score">' + btns + '</div>' +
        '<div class="anchor-row"><span><b>1–3</b> ' + escapeHtml(r.low) + '</span><span><b>4–7</b> ' + escapeHtml(r.mid) + '</span><span><b>8–10</b> ' + escapeHtml(r.high) + '</span></div>' +
        '<textarea class="rubric-notes" data-notes="' + r.key + '" rows="1" placeholder="Notes (optional)">' + escapeHtml(cur.notes || '') + '</textarea>' +
      '</div>';
    }).join('');
    var tot = ratingTotal(rt);
    var trackOpts = '<option value="">Choose…</option>' + TRACK_OPTIONS.map(function(t){ return '<option' + (rt.track === t ? ' selected' : '') + '>' + t + '</option>'; }).join('');
    return '' +
    '<button class="btn btn-sm" id="rt-back" style="margin-bottom:14px;">← Back to notes</button>' +
    '<div class="view-head"><div><h2>Interview Evaluation <span class="pill pill-warning" style="vertical-align:middle;">Mandatory</span></h2>' +
      '<p class="sub">Rate <strong>' + escapeHtml(d.candidateName) + '</strong> on each category — 1–3 weak, 4–7 solid, 8–10 exceptional. The guide under each row shows what each range looks like.</p></div></div>' +
    '<div class="rubric-list">' + rows + '</div>' +
    '<div class="card card-pad rubric-extra">' +
      '<div class="field-group"><label>Did they have questions for us? <span style="color:var(--live);">*</span></label>' +
        '<div class="yn-row">' +
          '<button type="button" class="yn-btn' + (rt.askedQuestions === 'yes' ? ' on yes' : '') + '" data-yn="yes">Yes</button>' +
          '<button type="button" class="yn-btn' + (rt.askedQuestions === 'no' ? ' on no' : '') + '" data-yn="no">No — red flag</button>' +
        '</div></div>' +
      '<div class="field-group"><label>Fund or Consulting?</label><select id="rt-track">' + trackOpts + '</select></div>' +
      '<div class="field-group" style="margin-bottom:0;"><label>Red flags / concerns</label><textarea id="rt-redflags" rows="2" placeholder="Dealbreakers or anything the board should know — late, rude, can’t commit to meetings…">' + escapeHtml(rt.redFlags || '') + '</textarea></div>' +
    '</div>' +
    '<div class="rubric-footer">' +
      '<div><div class="rubric-total" id="rt-total">' + tot.total + ' <span>/ ' + RUBRIC_MAX + '</span></div><div class="hint" id="rt-progress">' + tot.scored + ' of ' + RUBRIC.length + ' categories scored</div></div>' +
      '<button class="btn btn-primary" id="rt-submit">Submit interview &amp; rating</button>' +
    '</div>';
  }

  function wireRating(){
    var root = document.getElementById('view-root');
    var rt = reviewDraft.rating;
    function refreshTotals(){
      var t = ratingTotal(rt);
      var el = document.getElementById('rt-total'); if (el) el.innerHTML = t.total + ' <span>/ ' + RUBRIC_MAX + '</span>';
      var pr = document.getElementById('rt-progress'); if (pr) pr.textContent = t.scored + ' of ' + RUBRIC.length + ' categories scored';
    }
    root.querySelectorAll('textarea.rubric-notes, #rt-redflags').forEach(autosizeQ);
    root.addEventListener('click', function(e){
      var sb = e.target.closest('.score-btn');
      if (sb){
        var key = sb.dataset.key, n = parseInt(sb.dataset.score, 10);
        rt.scores[key].score = n;
        var row = root.querySelector('.rubric-row[data-row="' + key + '"]');
        row.querySelectorAll('.score-btn').forEach(function(b){ var on = parseInt(b.dataset.score,10) === n; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
        row.classList.add('done'); row.classList.remove('missing');
        document.getElementById('now-' + key).innerHTML = n + '<span>/10</span>';
        refreshTotals();
        return;
      }
      var yn = e.target.closest('.yn-btn');
      if (yn){
        rt.askedQuestions = yn.dataset.yn;
        root.querySelectorAll('.yn-btn').forEach(function(b){ b.classList.remove('on', 'yes', 'no'); });
        yn.classList.add('on', rt.askedQuestions);
        root.querySelector('.yn-row').classList.remove('missing');
      }
    });
    root.addEventListener('input', function(e){
      var t = e.target;
      if (t.dataset && t.dataset.notes){ rt.scores[t.dataset.notes].notes = t.value; autosizeQ(t); }
      else if (t.id === 'rt-redflags'){ rt.redFlags = t.value; autosizeQ(t); }
    });
    root.addEventListener('change', function(e){ if (e.target.id === 'rt-track') rt.track = e.target.value; });
    document.getElementById('rt-back').addEventListener('click', function(){ niStep = 'review'; renderView(); window.scrollTo(0, 0); });
    document.getElementById('rt-submit').addEventListener('click', function(){
      var missing = RUBRIC.filter(function(r){ return !rt.scores[r.key].score; });
      missing.forEach(function(r){ root.querySelector('.rubric-row[data-row="' + r.key + '"]').classList.add('missing'); });
      if (!rt.askedQuestions) root.querySelector('.yn-row').classList.add('missing');
      if (missing.length){
        toast('Score every category first — missing: ' + missing.map(function(r){ return r.name; }).join(', ') + '.', 'warn');
        root.querySelector('.rubric-row.missing').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (!rt.askedQuestions){ toast('Answer “Did they have questions for us?” first.', 'warn'); root.querySelector('.yn-row').scrollIntoView({ behavior:'smooth', block:'center' }); return; }
      submitInterviewWithRating(this);
    });
  }

  function submitInterviewWithRating(submitBtn){
    var d = reviewDraft;
    var rt = d.rating;
    var t = ratingTotal(rt);
    var interview = {
      id: uid('int'),
      candidateName: d.candidateName.trim(),
      submittedBy: d.submittedBy.trim(),
      startedAt: d.startedAt,
      endedAt: d.endedAt,
      durationSec: Math.round(((d.endedAt||Date.now()) - (d.startedAt||Date.now()))/1000),
      openingRemarks: d.opening || '',
      qa: d.qa.map(function(q){ var c = Object.assign({}, q); delete c.summaryEdited; return c; }),
      overallSummary: d.overallSummary || '',
      rawTranscript: d.rawTranscript || '',
      rating: {
        scores: deepClone(rt.scores), askedQuestions: rt.askedQuestions, track: rt.track || '', redFlags: (rt.redFlags || '').trim(),
        total: t.total, max: RUBRIC_MAX, ratedBy: d.submittedBy.trim(), ratedAt: Date.now()
      },
      submittedAt: Date.now()
    };
    var ns = deepClone(state);
    ns.interviews.push(interview);
    submitBtn.disabled = true;
    publishState(ns, 'Interview & rating for ' + interview.candidateName + ' submitted').then(function(){
      recSession = null; reviewDraft = null; niStep = 'setup';
      setupPick = { candidateName:'', submittedBy: interview.submittedBy, useCustomName:false };
      currentView = 'dashboard';
      renderView();
    });
  }

  /* ---------- Review ---------- */
  function renderReviewHtml(){
    var d = reviewDraft;
    if (!d) return '<p class="hint">Nothing to review yet.</p>';
    var qaCards = d.qa.map(function(qa, i){
      var skipOk = questionSkipOk(qa, d.qa);
      var flag = qa.asked ? '' :
        (skipOk === 'group-covered' ? '<span class="not-asked-flag" style="color:var(--text-muted);">not needed — another question in this set was covered</span>'
         : qa.group ? '<span class="not-asked-flag">choose one from this set — none detected yet</span>'
         : '<span class="not-asked-flag">not confidently detected — check transcript</span>');
      var tagsHtml = (qa.group ? ' <span class="pill pill-muted" title="Only one question in this set needs to be asked">Choose one</span>' : '');
      return '<div class="qa-card">' +
        '<div class="q-text">' + escapeHtml(qa.questionText) + tagsHtml + ' ' + flag + '</div>' +
        '<textarea data-i="' + i + '" data-field="answerText">' + escapeHtml(qa.answerText) + '</textarea>' +
        '<div class="summary-label">Summary (editable)</div>' +
        '<textarea class="summary" data-i="' + i + '" data-field="summary">' + escapeHtml(qa.summary) + '</textarea>' +
      '</div>';
    }).join('');

    return '' +
    '<button class="btn btn-sm" id="back-to-recording" style="margin-bottom:14px;">← Back</button>' +
    '<div class="view-head"><div><h2>Review before submitting</h2><p class="sub">Fix anything the auto-detection missed, then submit — this becomes part of the shared record.</p></div></div>' +
    '<div class="ai-status" id="ai-status"><span id="ai-status-text">Checking for AI…</span><button class="btn btn-sm" id="ai-run-btn" hidden>✨ Turn on AI summaries</button></div>' +
    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<div class="field-group"><label>Candidate</label><input id="rv-candidate" value="' + escapeHtml(d.candidateName) + '"></div>' +
      '<div class="field-group" style="margin-bottom:0;"><label>Submitted by</label><select id="rv-submitted-by">' + boardOptionsHtml(d.submittedBy) + '</select></div>' +
    '</div>' +
    (d.opening && d.opening.trim() ? '<div class="qa-card"><div class="q-text">Opening remarks / other speech</div><textarea id="rv-opening">' + escapeHtml(d.opening) + '</textarea></div>' : '') +
    qaCards +
    '<div class="card card-pad" style="margin-bottom:18px;">' +
      '<div class="field-group" style="margin-bottom:0;"><label>Overall summary (editable)</label><textarea id="rv-overall" style="min-height:90px;">' + escapeHtml(d.overallSummary) + '</textarea></div>' +
    '</div>' +
    '<div class="rec-footer">' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="btn btn-danger" id="rv-discard">Discard</button>' +
      '</div>' +
      '<button class="btn btn-primary" id="rv-submit">Next: rate candidate →</button>' +
    '</div>';
  }

  function wireReview(){
    var root = document.getElementById('view-root');
    root.addEventListener('change', function(e){ if (e.target.id === 'rv-submitted-by') reviewDraft.submittedBy = e.target.value; });
    root.addEventListener('input', function(e){
      var t = e.target;
      if (t.id === 'rv-candidate') reviewDraft.candidateName = t.value;
      else if (t.id === 'rv-submitted-by') reviewDraft.submittedBy = t.value;
      else if (t.id === 'rv-submitted-by') reviewDraft.submittedBy = t.value;
      else if (t.id === 'rv-opening') reviewDraft.opening = t.value;
      else if (t.id === 'rv-overall'){ reviewDraft.overallSummary = t.value; reviewDraft.overallEdited = true; autosizeQ(t); }
      else if (t.dataset && t.dataset.field && t.dataset.i !== undefined){
        var qaItem = reviewDraft.qa[parseInt(t.dataset.i,10)];
        qaItem[t.dataset.field] = t.value;
        if (t.dataset.field === 'summary'){ qaItem.summaryEdited = true; autosizeQ(t); }
      }
    });
    root.querySelectorAll('textarea.summary, #rv-overall').forEach(autosizeQ);
    var aiBtn = document.getElementById('ai-run-btn');
    if (aiBtn) aiBtn.addEventListener('click', function(){
      var redo = /Redo/.test(aiBtn.textContent);
      if (redo && !window.confirm('Redo the AI summaries? This replaces the current summaries, including any edits you made to them.')) return;
      runAiSummaries(redo);
    });
    aiCheckAndMaybeRun();
    function goBackDiscard(message, confirmLabel){
      showConfirm(message, confirmLabel, function(){
        recSession = null; reviewDraft = null; niStep = 'setup'; forcePasteMode = false;
        renderView();
      });
    }
    var backBtn = document.getElementById('back-to-recording');
    if (backBtn) backBtn.addEventListener('click', function(){
      goBackDiscard('Go back? This interview hasn’t been submitted yet — going back will discard it. (The recording itself has already stopped, so you\'ll need to start a fresh interview.)', 'Go back');
    });
    var discardBtn = document.getElementById('rv-discard');
    if (discardBtn) discardBtn.addEventListener('click', function(){
      goBackDiscard('Discard this interview? Nothing will be saved.', 'Discard');
    });
    var submitBtn = document.getElementById('rv-submit');
    if (submitBtn) submitBtn.addEventListener('click', function(){
      if (!reviewDraft.candidateName.trim()){ toast('Candidate name can’t be empty.', 'warn'); return; }
      if (!reviewDraft.submittedBy.trim()){ toast('Choose who’s submitting this interview.', 'warn'); return; }
      if (!reviewDraft.rating) reviewDraft.rating = blankRating();
      niStep = 'rating';
      renderView();
      window.scrollTo(0, 0);
    });
  }

  /* ============================================================
     Boot
     ============================================================ */
  initShell();
})();

</script>
</body>
</html>
